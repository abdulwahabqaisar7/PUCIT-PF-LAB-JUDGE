{% extends "base.html" %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center text-center mt-5">
    <div class="col-md-6">
        <div class="display-1 text-danger font-weight-bold mb-3"><i class="bi bi-shield-x"></i> 403</div>
        <h3 class="mb-3">Access Forbidden</h3>
        <p class="text-muted lead">{{ error.description if error and error.description else "You do not have permission to access this resource." }}</p>
        <a href="/" class="btn btn-primary mt-3"><i class="bi bi-house me-1"></i> Return Home</a>
    </div>
</div>
{% endblock %}
