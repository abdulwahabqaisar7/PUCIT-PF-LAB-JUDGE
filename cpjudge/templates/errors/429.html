{% extends "base.html" %}

{% block title %}429 Too Many Requests{% endblock %}

{% block content %}
<div class="row justify-content-center text-center mt-5">
    <div class="col-md-6">
        <div class="display-1 text-warning font-weight-bold mb-3"><i class="bi bi-hourglass-split"></i> 429</div>
        <h3 class="mb-3">Rate Limit Exceeded</h3>
        <p class="text-muted lead">You have made too many requests in a short period. Please wait a moment and try again.</p>
        <a href="/" class="btn btn-primary mt-3"><i class="bi bi-house me-1"></i> Return Home</a>
    </div>
</div>
{% endblock %}
