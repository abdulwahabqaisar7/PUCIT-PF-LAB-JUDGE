services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python run.py
    ports:
      - "${PORT:-5050}:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m cpjudge.worker
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    # Required for Linux bubblewrap & setrlimit sandbox capabilities
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    depends_on:
      - web
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: pytest -v
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
