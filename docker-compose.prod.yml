# CPJudge Production Docker Compose Configuration (Internet Deployment)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
services:
  # Web application served via Gunicorn multi-worker WSGI
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn -w 4 -k gthread --threads 2 -b 0.0.0.0:5000 --access-logfile - --error-logfile - "run:app"
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=${APP_TIMEZONE:-Asia/Karachi}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Karachi}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cpjudge}:${POSTGRES_PASSWORD:-change_this_postgres_password}@db:5432/${POSTGRES_DB:-cpjudge}
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - USE_PROXY_FIX=true
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - PREFERRED_URL_SCHEME=${PREFERRED_URL_SCHEME:-https}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # Background sandboxed evaluation worker daemon
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m cpjudge.worker
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=${APP_TIMEZONE:-Asia/Karachi}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Karachi}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cpjudge}:${POSTGRES_PASSWORD:-change_this_postgres_password}@db:5432/${POSTGRES_DB:-cpjudge}
      - USE_BWRAP=true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # High-concurrency relational database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpjudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-cpjudge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # In-memory store for distributed rate-limiting across Gunicorn workers
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Reverse proxy with automatic HTTPS via Let's Encrypt
  # (Comment this service out if using Cloudflare Tunnel instead)
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
